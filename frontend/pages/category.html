<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1565c0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue — E-Shopia Maroc</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/megamenu.css">
</head>
<body>
<div id="nav"></div>

<div class="pg-head">
  <div class="container">
    <h1 id="pgTitle">Catalogue</h1>
    <div class="breadcrumb">
      <a href="../index.html">Accueil</a><span class="sep">/</span><span id="pgCat">Tout</span>
    </div>
  </div>
</div>

<div class="container">
  <div class="catalog-layout">
    <!-- Sidebar — built by JS -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main -->
    <div>
      <button class="mob-filter-btn" id="mobFilterBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">⚙ Filtres</button>
      <div class="toolbar">
        <span class="tb-count" id="prodCount">0 produits</span>
        <div class="tb-sort">
          <span>Trier par:</span>
          <select id="sortSel" onchange="applyFilters()">
            <option value="default">Pertinence</option>
            <option value="price-asc">Prix croissant</option>
            <option value="price-desc">Prix décroissant</option>
            <option value="rating">Meilleures notes</option>
            <option value="disc">Meilleures remises</option>
            <option value="reviews">Plus d'avis</option>
          </select>
        </div>
      </div>
      <div class="prod-grid" id="prodGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<div id="footer-root"></div>
<div id="whatsapp-root"></div><div id="backtop-root"></div>
<div id="modal-root"></div>
<div class="toasts"></div>

<script>window.ESHOPIA_API_URL="https://eshopia-backend.onrender.com/api";</script>
<script src="../js/script.js"></script>
<script src="../js/megamenu.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/api.js"></script>
<script src="../js/features.js"></script>
<script src="../js/pwa.js"></script>
<script>
document.getElementById("nav").innerHTML         = buildNav("../");
document.getElementById("footer-root").innerHTML = buildFooter("../");
document.getElementById("modal-root").innerHTML  = buildLoginModal();
Cart.badge();
document.getElementById("whatsapp-root").innerHTML=buildWhatsApp();
document.getElementById("backtop-root").innerHTML=buildBackToTop();

const params  = new URLSearchParams(location.search);
const initCat = params.get("cat") || "Tout";
const initQ   = params.get("search") || "";

document.getElementById("pgTitle").textContent = initQ ? `Résultats: "${initQ}"` : initCat === "Tout" ? "Catalogue" : initCat;
document.getElementById("pgCat").textContent   = initQ ? "Recherche" : initCat;

/* ── Build sidebar via JS so template literals work ── */
const catList = ["Tout","Électronique","Informatique & Bureau","Accessoires Téléphone","Maison & Cuisine","Mode","Beauté & Soins","Sport & Fitness","Auto & Moto","Gaming","Offres Spéciales"];
document.getElementById("sidebar").innerHTML = `
  <div class="sb-hd">
    <h3>Filtres</h3>
    <button class="btn btn-ghost btn-sm" onclick="resetFilters()">Réinitialiser</button>
  </div>
  <div class="f-grp">
    <h4>Catégories</h4>
    ${catList.map(c => `
    <label class="f-opt">
      <input type="radio" name="fCat" value="${c}" ${c === initCat ? "checked" : ""} onchange="applyFilters()"> ${c}
    </label>`).join("")}
  </div>
  <div class="f-grp">
    <h4>Prix maximum</h4>
    <div class="p-sl">
      <input type="range" min="0" max="2000" value="2000" id="priceSlider"
        oninput="document.getElementById('priceVal').textContent=this.value+' DH';applyFilters()">
      <div class="p-sl-labs"><span>0 DH</span><span id="priceVal">2000 DH</span></div>
    </div>
  </div>
  <div class="f-grp">
    <h4>Note minimale</h4>
    ${[5,4,3].map(r => `
    <label class="f-opt">
      <input type="radio" name="fRating" value="${r}" onchange="applyFilters()">
      ${"★".repeat(r)} et +
    </label>`).join("")}
    <label class="f-opt">
      <input type="radio" name="fRating" value="0" checked onchange="applyFilters()"> Toutes
    </label>
  </div>
  <div class="f-grp">
    <h4>Disponibilité</h4>
    <label class="f-opt"><input type="checkbox" id="fStock" onchange="applyFilters()"> En stock uniquement</label>
    <label class="f-opt"><input type="checkbox" id="fDisc"  onchange="applyFilters()"> En promotion</label>
  </div>`;

const PAGE = 12;
let curPage = 1;

function applyFilters() {
  const cat     = document.querySelector("[name='fCat']:checked")?.value || "Tout";
  const maxP    = +(document.getElementById("priceSlider")?.value || 2000);
  const minR    = +(document.querySelector("[name='fRating']:checked")?.value || 0);
  const onlyStk = document.getElementById("fStock")?.checked;
  const onlyDis = document.getElementById("fDisc")?.checked;
  const sort    = document.getElementById("sortSel")?.value || "default";

  let items = [...PRODUCTS];
  if (initQ)      items = items.filter(p => p.name.toLowerCase().includes(initQ.toLowerCase()) || p.cat.toLowerCase().includes(initQ.toLowerCase()));
  if (cat !== "Tout") items = items.filter(p => p.cat === cat);
  items = items.filter(p => p.price <= maxP);
  if (minR > 0)   items = items.filter(p => p.rating >= minR);
  if (onlyStk)    items = items.filter(p => p.stock > 0);
  if (onlyDis)    items = items.filter(p => p.old && p.old > p.price);

  const sortFn = {
    "price-asc":  (a,b) => a.price - b.price,
    "price-desc": (a,b) => b.price - a.price,
    "rating":     (a,b) => b.rating - a.rating,
    "disc":       (a,b) => disc(b.old,b.price) - disc(a.old,a.price),
    "reviews":    (a,b) => b.rev - a.rev,
  };
  if (sortFn[sort]) items.sort(sortFn[sort]);

  document.getElementById("prodCount").textContent = `${items.length} produit${items.length !== 1 ? "s" : ""}`;
  curPage = 1;
  renderPage(items);
}

function renderPage(items) {
  const slice = items.slice((curPage-1)*PAGE, curPage*PAGE);
  document.getElementById("prodGrid").innerHTML = slice.length
    ? slice.map(p => pCard(p, "../")).join("")
    : `<div style="grid-column:1/-1;padding:60px;text-align:center;color:var(--text4)">
        <div style="font-size:3rem;margin-bottom:12px">🔍</div>
        <div style="font-family:var(--fh);font-size:1rem;font-weight:700;margin-bottom:6px">Aucun produit trouvé</div>
        <div style="font-size:.85rem">Essayez de modifier vos filtres</div>
       </div>`;

  const pages = Math.ceil(items.length / PAGE);
  document.getElementById("pagination").innerHTML = pages > 1
    ? Array.from({length:pages}, (_,i) =>
        `<button class="pg-btn ${i+1===curPage?"on":""}" onclick="curPage=${i+1};applyFilters()">${i+1}</button>`
      ).join("") : "";
}

function resetFilters() {
  document.querySelector("[name='fCat']").checked = true;
  const ps = document.getElementById("priceSlider"); if(ps) ps.value = 2000;
  const pv = document.getElementById("priceVal");    if(pv) pv.textContent = "2000 DH";
  document.querySelector("[name='fRating'][value='0']").checked = true;
  const fs = document.getElementById("fStock"); if(fs) fs.checked = false;
  const fd = document.getElementById("fDisc");  if(fd) fd.checked = false;
  document.getElementById("sortSel").value = "default";
  applyFilters();
}

/* ── Load products from API (enriches local PRODUCTS array) ── */
let _apiProductsLoaded = false;
async function loadProductsFromAPI() {
  if (_apiProductsLoaded) return;
  try {
    const API = window.ESHOPIA_API_URL || 'https://eshopia-backend.onrender.com/api';
    const params = new URLSearchParams(window.location.search);
    const cat    = params.get('cat') || 'Tout';
    const search = params.get('search') || '';

    const qs = new URLSearchParams({ limit: 50, sort: '-sold' });
    if (cat && cat !== 'Tout') qs.set('cat', cat);
    if (search) qs.set('search', search);

    const res  = await fetch(`${API}/products?${qs}`);
    if (!res.ok) return;
    const data = await res.json();

    if (data.products && data.products.length) {
      // Merge API products into PRODUCTS array (update stock, price, sold)
      data.products.forEach(dbP => {
        const local = window.PRODUCTS.find(p => String(p.id) === String(dbP._id));
        if (local) {
          local.price  = dbP.price;
          local.old    = dbP.oldPrice || local.old;
          local.stock  = dbP.stock;
          local.sold   = dbP.sold;
          local.rating = dbP.rating || local.rating;
          local.rev    = dbP.reviewCount || local.rev;
        }
      });
      _apiProductsLoaded = true;
      applyFilters(); // Re-render with fresh data
    }
  } catch(e) { /* silently use local data */ }
}

loadProductsFromAPI();
applyFilters();
</script>
</body>
</html>
