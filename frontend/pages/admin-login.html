<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Login - E-Shopia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background: #071739;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: #0b1d45;
            padding: 40px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 0 30px rgba(0, 0, 0, .3);
        }

        h1 {
            margin-bottom: 30px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            background: #132b63;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>Admin Login</h1>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Admin Email" required />

            <input type="password" id="password" placeholder="Password" required />

            <button type="submit">
                Login
            </button>
        </form>

        <div class="error" id="error"></div>
    </div>

    <script>

        const API =
            "https://eshopia-backend.onrender.com/api/admin/login";

        document
            .getElementById("loginForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const error =
                    document.getElementById("error");

                error.innerHTML = "";

                try {

                    const res = await fetch(API, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email,
                            password
                        })
                    });

                    const data = await res.json();

                    if (data.token) {

                        localStorage.setItem(
                            "adminToken",
                            data.token
                        );

                        window.location.href = "/admin";

                    } else {

                        error.innerHTML =
                            "Invalid credentials";

                    }

                } catch (err) {

                    error.innerHTML =
                        "Server error";

                }

            });

    </script>

</body>

</html>
